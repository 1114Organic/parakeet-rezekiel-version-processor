# Global settings
settings:
  audio_format: "wav"
  max_episodes_per_feed: 1
  transcribe_workers: 4
  
  # Optional: customize auto-generated blog post topics
  # If not specified, topics are automatically extracted from podcast summaries
  auto_write_topics:
    - "AI and Emerging Technologies"
    - "Venture Capital Trends"
  cleanup_old_files: true
  cleanup_days: 30
  
  # Transcription
  whisper_model: "base"  # tiny, base, small, medium, large
  parakeet_enabled: false  # Use Parakeet MLX on Apple Silicon (disabled due to memory limits)
  parakeet_model: "mlx-community/parakeet-tdt-0.6b-v2"
  # Number of parallel workers for `p3 transcribe` when run from the pipeline
  transcribe_workers: 4
  
  # LLM cleaning
  llm_provider: "ollama"  # openai, anthropic, ollama
  llm_model: "llama3.2:latest"  # For Ollama: llama3.2, qwen2.5, etc.
  ollama_base_url: "http://localhost:11434"
  
  # Output
  export_format: ["markdown", "json"]
  email_enabled: false
